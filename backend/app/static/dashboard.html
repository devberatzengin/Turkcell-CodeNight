<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game+ Quest League Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #667eea;
        }
        table tr:hover {
            background: #f9f9f9;
        }
        .btn {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn:hover {
            background: #764ba2;
        }
        .btn-secondary {
            background: #764ba2;
        }
        .btn-secondary:hover {
            background: #667eea;
        }
        .badge { 
            display: inline-block; 
            padding: 4px 8px; 
            background: #667eea; 
            color: white; 
            border-radius: 4px; 
            font-size: 0.85em; 
        }
        .user-detail {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric {
            background: #f0f2f5;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }
        .metric-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-buttons button {
            padding: 10px 15px;
            background: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .tab-buttons button.active {
            background: #667eea;
            color: white;
        }
        .hidden { display: none; }
        .loading { text-align: center; color: #999; }
        .error { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Game+ Quest League Dashboard</h1>
            <p>Real-time leaderboard, user metrics, and quest tracking</p>
        </header>

        <div class="grid">
            <!-- Leaderboard -->
            <div class="card">
                <h2>🏆 Top 10 Leaderboard</h2>
                <div id="leaderboard-container" class="loading">Loading...</div>
            </div>

            <!-- Users List -->
            <div class="card">
                <h2>👥 Users</h2>
                <div id="users-container" class="loading">Loading...</div>
            </div>
        </div>

        <!-- User Details -->
        <div class="user-detail hidden" id="user-detail-container">
            <button class="btn" onclick="closeUserDetail()">← Back</button>
            <h2 id="user-detail-name"></h2>
            
            <h3 style="margin-top: 20px; color: #667eea;">Today's Metrics</h3>
            <div class="detail-grid" id="today-metrics"></div>

            <h3 style="margin-top: 20px; color: #667eea;">7-Day Metrics</h3>
            <div class="detail-grid" id="week-metrics"></div>

            <h3 style="margin-top: 20px; color: #667eea;">Achievements</h3>
            <div class="tab-buttons">
                <button class="active" onclick="switchTab('badges')">Badges</button>
                <button onclick="switchTab('awards')">Quest Awards</button>
                <button onclick="switchTab('notifs')">Notifications</button>
            </div>

            <div id="badges-tab">
                <div id="badges-container" class="loading">Loading...</div>
            </div>
            <div id="awards-tab" class="hidden">
                <div id="awards-container" class="loading">Loading...</div>
            </div>
            <div id="notifs-tab" class="hidden">
                <div id="notifs-container" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentUser = null;

        async function fetchLeaderboard() {
            try {
                const res = await fetch(`${API_URL}/leaderboard/top?n=10`);
                const data = await res.json();
                const html = `
                    <table>
                        <thead><tr><th>Rank</th><th>User</th><th>Points</th></tr></thead>
                        <tbody>
                            ${data.map(r => `
                                <tr onclick="showUserDetail('${r.user_id}')" style="cursor:pointer;">
                                    <td>#${r.rank}</td>
                                    <td><strong>${r.user_id}</strong></td>
                                    <td>${r.total_points}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('leaderboard-container').innerHTML = html;
            } catch (e) {
                document.getElementById('leaderboard-container').innerHTML = `<div class="error">Error loading leaderboard</div>`;
            }
        }

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/users/?limit=20`);
                const data = await res.json();
                const html = `
                    <table>
                        <thead><tr><th>User ID</th><th>Name</th><th>Segment</th><th>City</th></tr></thead>
                        <tbody>
                            ${data.map(u => `
                                <tr onclick="showUserDetail('${u.user_id}')" style="cursor:pointer;">
                                    <td><strong>${u.user_id}</strong></td>
                                    <td>${u.name || '—'}</td>
                                    <td>${u.segment || '—'}</td>
                                    <td>${u.city || '—'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('users-container').innerHTML = html;
            } catch (e) {
                document.getElementById('users-container').innerHTML = `<div class="error">Error loading users</div>`;
            }
        }

        async function showUserDetail(userId) {
            currentUser = userId;
            document.querySelectorAll('.grid')[0]?.style.display = 'none';
            document.getElementById('user-detail-container').classList.remove('hidden');

            try {
                // Load user info and state
                const userRes = await fetch(`${API_URL}/users/${userId}`);
                const userData = await userRes.json();
                const state = userData.state || {};

                document.getElementById('user-detail-name').textContent = `${userData.user.name} (${userId})`;

                // Today's metrics
                document.getElementById('today-metrics').innerHTML = `
                    <div class="metric"><div class="metric-label">Logins</div><div class="metric-value">${state.login_count_today || 0}</div></div>
                    <div class="metric"><div class="metric-label">Play Time</div><div class="metric-value">${state.play_minutes_today || 0}m</div></div>
                    <div class="metric"><div class="metric-label">PvP Wins</div><div class="metric-value">${state.pvp_wins_today || 0}</div></div>
                    <div class="metric"><div class="metric-label">Coop Time</div><div class="metric-value">${state.coop_minutes_today || 0}m</div></div>
                    <div class="metric"><div class="metric-label">Top-ups</div><div class="metric-value">${state.topup_try_today || 0}</div></div>
                `;

                // 7-day metrics
                document.getElementById('week-metrics').innerHTML = `
                    <div class="metric"><div class="metric-label">Play Time</div><div class="metric-value">${state.play_minutes_7d || 0}m</div></div>
                    <div class="metric"><div class="metric-label">Logins</div><div class="metric-value">${state.logins_7d || 0}</div></div>
                    <div class="metric"><div class="metric-label">Top-ups</div><div class="metric-value">${state.topup_try_7d || 0}</div></div>
                    <div class="metric"><div class="metric-label">Login Streak</div><div class="metric-value">${state.login_streak_days || 0}d</div></div>
                    <div class="metric"><div class="metric-label">Total Points</div><div class="metric-value">${state.total_points || 0}</div></div>
                `;

                // Load badges
                const badgesRes = await fetch(`${API_URL}/badge_awards/user/${userId}`);
                const badges = await badgesRes.json();
                document.getElementById('badges-container').innerHTML = badges.length > 0
                    ? `<div>${badges.map(b => `<span class="badge">${b.badge_name} (Lvl ${b.level})</span>`).join(' ')}</div>`
                    : '<div class="error">No badges earned yet</div>';

                // Load quest awards
                const awardsRes = await fetch(`${API_URL}/awards/user/${userId}`);
                const awards = await awardsRes.json();
                document.getElementById('awards-container').innerHTML = awards.length > 0
                    ? `<table><thead><tr><th>Date</th><th>Quest</th><th>Points</th></tr></thead><tbody>${awards.map(a => `<tr><td>${a.as_of_date}</td><td>${a.selected_quest}</td><td>+${a.reward_points}</td></tr>`).join('')}</tbody></table>`
                    : '<div class="error">No quest awards yet</div>';

                // Load notifications
                const notifsRes = await fetch(`${API_URL}/notifications/user/${userId}`);
                const notifs = await notifsRes.json();
                document.getElementById('notifs-container').innerHTML = notifs.length > 0
                    ? `<div>${notifs.slice(0, 10).map(n => `<div style="padding: 8px; background: #f5f5f5; margin-bottom: 8px; border-radius: 4px;"><strong>${n.channel}:</strong> ${n.message}</div>`).join('')}</div>`
                    : '<div class="error">No notifications</div>';
            } catch (e) {
                document.getElementById('user-detail-container').innerHTML = `<div class="error">Error loading user detail: ${e.message}</div>`;
            }
        }

        function closeUserDetail() {
            document.getElementById('user-detail-container').classList.add('hidden');
            document.querySelectorAll('.grid')[0].style.display = 'grid';
            currentUser = null;
        }

        function switchTab(tab) {
            document.querySelectorAll('[id$="-tab"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-buttons button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.remove('hidden');
            event.target.classList.add('active');
        }

        // Load on page load
        window.addEventListener('load', () => {
            fetchLeaderboard();
            fetchUsers();
        });
    </script>
</body>
</html>
