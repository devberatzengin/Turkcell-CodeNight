version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: turkcell_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turkcell_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gamification_database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamification_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: turkcell_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/turkcell_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
    networks:
      - gamification_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  gamification_network:
    driver: bridge
